<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nervensystem-Selbsttest | Theresa Ross</title>
  <meta name="description" content="Wo steht dein Nervensystem? 15 Fragen. 3 Minuten. Klarheit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bordeaux: #7A3B3B; --terracotta: #C89B8C; --mint: #A8C9BC; --gold: #B8956A; --bg-light: #F4F1ED; --bg-medium: #E8E3DC; --text-dark: #3A3633; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; color: var(--text-dark); background: var(--bg-light); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: 'Cormorant Garamond', serif; line-height: 1.2; }
    a { text-decoration: none; color: inherit; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(244,241,237,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(232,227,220,0.5); }
    .nav-inner { max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; color: var(--bordeaux); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { font-size: 0.9rem; color: rgba(58,54,51,0.7); transition: color 0.2s; }
    .nav-links a:hover { color: var(--bordeaux); }
    .nav-cta { background: var(--bordeaux) !important; color: var(--bg-light) !important; padding: 10px 24px; border-radius: 6px; font-weight: 600; font-size: 0.9rem !important; transition: background 0.2s !important; }
    .nav-cta:hover { background: var(--terracotta) !important; }
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; }

    /* Test Styles */
    .test-container { max-width: 700px; margin: 0 auto; padding: 140px 24px 100px; min-height: 80vh; }
    .btn-primary { display: inline-block; background: var(--bordeaux); color: var(--bg-light); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; padding: 16px 32px; border-radius: 6px; transition: background 0.2s; border: none; cursor: pointer; }
    .btn-primary:hover { background: var(--terracotta); }

    /* Progress */
    .progress-bar { width: 100%; height: 8px; background: var(--bg-medium); border-radius: 99px; overflow: hidden; margin-bottom: 32px; }
    .progress-fill { height: 100%; background: var(--mint); border-radius: 99px; transition: width 0.5s ease; }
    .progress-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: rgba(58,54,51,0.5); }

    /* Question */
    .question-text { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 500; text-align: center; margin-bottom: 40px; line-height: 1.3; }

    /* Scale */
    .scale-options { display: flex; flex-direction: column; gap: 12px; }
    .scale-btn {
      width: 100%; text-align: left; padding: 16px 20px; border-radius: 12px;
      border: 2px solid var(--bg-medium); background: transparent;
      font-family: 'Inter', sans-serif; font-size: 1rem; color: var(--text-dark);
      cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 16px;
    }
    .scale-btn:hover { border-color: var(--bordeaux); background: rgba(122,59,59,0.03); }
    .scale-num {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bg-medium);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
    }

    /* Back */
    .back-btn { background: none; border: none; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: rgba(58,54,51,0.4); cursor: pointer; margin-top: 24px; transition: color 0.2s; }
    .back-btn:hover { color: var(--bordeaux); }

    /* Email */
    .email-input {
      width: 100%; padding: 16px 20px; border-radius: 12px; border: 2px solid var(--bg-medium);
      font-family: 'Inter', sans-serif; font-size: 1.1rem; color: var(--text-dark);
      text-align: center; background: transparent; transition: border-color 0.2s; outline: none;
    }
    .email-input:focus { border-color: var(--bordeaux); }
    .checkbox-label { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; text-align: left; cursor: pointer; }
    .checkbox-label input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--bordeaux); flex-shrink: 0; }
    .checkbox-label span { font-size: 0.85rem; color: rgba(58,54,51,0.6); line-height: 1.5; }
    .checkbox-label a { color: var(--bordeaux); text-decoration: underline; }
    .hint { font-size: 0.75rem; color: rgba(58,54,51,0.35); margin-top: 16px; }

    /* Result */
    .result-circle {
      width: 128px; height: 128px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; margin-bottom: 24px; border-width: 4px; border-style: solid;
    }
    .result-circle span { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; }
    .result-card { padding: 32px; border-radius: 16px; margin: 32px 0; border-width: 1px; border-style: solid; }
    .result-card p { margin-bottom: 16px; }
    .result-card p:last-child { margin-bottom: 0; font-style: italic; color: rgba(58,54,51,0.7); }
    .share-btn { background: none; border: none; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--bordeaux); cursor: pointer; text-decoration: underline; transition: color 0.2s; }
    .share-btn:hover { color: var(--terracotta); }

    /* Animation */
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    footer { background: var(--text-dark); color: var(--bg-light); padding: 64px 24px; }
    .footer-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; }
    .footer-text { font-size: 0.85rem; color: rgba(244,241,237,0.6); }
    .footer-heading { font-size: 0.85rem; font-weight: 600; color: rgba(244,241,237,0.8); margin-bottom: 16px; }
    .footer-links { display: flex; flex-direction: column; gap: 8px; }
    .footer-links a { font-size: 0.85rem; color: var(--terracotta); transition: color 0.2s; }
    .footer-links a:hover { color: var(--bg-light); }
    .footer-bottom { max-width: 1200px; margin: 48px auto 0; padding-top: 32px; border-top: 1px solid rgba(244,241,237,0.1); text-align: center; font-size: 0.75rem; color: rgba(244,241,237,0.4); }

    @media (max-width: 768px) {
      .test-container { padding: 100px 24px 60px; }
      .question-text { font-size: 1.4rem; }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-light); padding: 24px; gap: 20px; border-bottom: 1px solid var(--bg-medium); }
      .nav-links.active { display: flex; } .menu-toggle { display: block; }
      .footer-inner { grid-template-columns: 1fr; gap: 32px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Theresa Ross</a>
      <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('active')">&#9776;</button>
      <div class="nav-links">
        <a href="privatpersonen.html">Für dich</a>
        <a href="unternehmen.html">Für Unternehmen</a>
        <a href="ueber-mich.html">Über mich</a>
        <a href="bibliothek.html">Bibliothek</a>
        <a href="selbsttest.html" class="nav-cta">Selbsttest</a>
      </div>
    </div>
  </nav>

  <div class="test-container" id="test-app"></div>

  <footer>
    <div class="footer-inner">
      <div><div class="footer-logo">Theresa Ross</div><p class="footer-text">Gesundheitsmentorin &<br>Nervensystem-Spezialistin</p></div>
      <div><p class="footer-heading">Navigation</p><div class="footer-links"><a href="privatpersonen.html">Für dich</a><a href="unternehmen.html">Für Unternehmen</a><a href="ueber-mich.html">Über mich</a><a href="bibliothek.html">Bibliothek</a><a href="selbsttest.html">Selbsttest</a></div></div>
      <div><p class="footer-heading">Rechtliches</p><div class="footer-links"><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></div></div>
    </div>
    <div class="footer-bottom">&copy; 2025 Theresa Ross. Alle Rechte vorbehalten.</div>
  </footer>

  <script>
    const questions = [
      { id: 1, text: "Ich fühle mich auch in ruhigen Momenten innerlich angespannt." },
      { id: 2, text: "Mein Schlaf bringt mir keine wirkliche Erholung." },
      { id: 3, text: "Meine Verdauung reagiert empfindlich auf Stress." },
      { id: 4, text: "Meine Energie schwankt stark über den Tag." },
      { id: 5, text: "Ich reagiere oft heftiger, als mir lieb ist." },
      { id: 6, text: "Mein Körper kommt nach Belastung nur schwer zur Ruhe." },
      { id: 7, text: "Ich habe das Gefühl, ständig im Funktionsmodus zu sein." },
      { id: 8, text: "Ich wache nachts auf und kann nicht wieder einschlafen." },
      { id: 9, text: "Blähungen, Krämpfe oder Unwohlsein begleiten mich regelmäßig." },
      { id: 10, text: "Nachmittags falle ich in ein tiefes Energieloch." },
      { id: 11, text: "Ich fühle mich emotional abgestumpft oder überreizt." },
      { id: 12, text: "Ich schrecke bei Geräuschen leicht zusammen." },
      { id: 13, text: "Ich kann nicht mehr klar priorisieren — alles fühlt sich dringend an." },
      { id: 14, text: "Tiefes Durchatmen fällt mir schwer — mein Atem bleibt flach." },
      { id: 15, text: "Ich brauche Koffein, Zucker oder Ablenkung, um durch den Tag zu kommen." }
    ];

    const scaleLabels = ["Trifft nicht zu", "Trifft selten zu", "Teils-teils", "Trifft oft zu", "Trifft voll zu"];

    const results = {
      balance: { title: "Du bist in Balance.", color: "mint", description: "Dein Nervensystem zeigt eine gute Grundregulation. Du hast Strategien, die funktionieren — und dein Körper dankt es dir.", recommendation: "Bleib dran. Kleine, regelmäßige Impulse halten dein System stabil.", cta: "Gratis-Workbook holen", link: "bibliothek.html#workbook" },
      warning: { title: "Erste Warnsignale.", color: "gold", description: "Dein Körper sendet leise Signale. Noch ist nichts entgleist — aber dein Nervensystem zeigt, dass es mehr Unterstützung braucht.", recommendation: "Jetzt ist der perfekte Zeitpunkt, aktiv zu werden. Nicht wenn es zu spät ist.", cta: "Gratis-Workbook herunterladen", link: "bibliothek.html#workbook" },
      attention: { title: "Dein Nervensystem braucht Aufmerksamkeit.", color: "terracotta", description: "Die Signale sind deutlich. Dein System ist überlastet und findet allein nicht mehr in die Balance. Das ist kein Versagen — das ist Biologie.", recommendation: "Ein strukturiertes Programm kann dir helfen, die Regulation wiederherzustellen.", cta: "Mehr über VAGUSFLOW", link: "privatpersonen.html#vagusflow" },
      acute: { title: "Akuter Handlungsbedarf.", color: "bordeaux", description: "Dein Nervensystem ist im Dauerstress-Modus. Was du erlebst, ist die Konsequenz eines Systems, das zu lange überlastet wurde. Aber: Es ist reversibel.", recommendation: "Individuelle Begleitung ist jetzt der sinnvollste nächste Schritt.", cta: "Erstgespräch vereinbaren", link: "kontakt.html" }
    };

    const colorMap = {
      mint: { bg: 'rgba(168,201,188,0.2)', border: '#A8C9BC' },
      gold: { bg: 'rgba(184,149,106,0.2)', border: '#B8956A' },
      terracotta: { bg: 'rgba(200,155,140,0.2)', border: '#C89B8C' },
      bordeaux: { bg: 'rgba(122,59,59,0.2)', border: '#7A3B3B' }
    };

    let currentQuestion = 0;
    let answers = [];
    const app = document.getElementById('test-app');

    function render(phase) {
      switch(phase) {
        case 'intro': renderIntro(); break;
        case 'question': renderQuestion(); break;
        case 'email': renderEmail(); break;
        case 'result': renderResult(); break;
      }
    }

    function renderIntro() {
      app.innerHTML = `
        <div class="fade-in" style="text-align: center;">
          <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 600; color: var(--bordeaux); margin-bottom: 24px;">Nervensystem-Selbsttest</h1>
          <p style="font-size: 1.15rem; margin-bottom: 8px; max-width: 500px; margin-left: auto; margin-right: auto;">Wo steht dein Nervensystem? 15 Fragen. Ehrliche Antworten. Klarheit.</p>
          <p style="font-size: 0.85rem; color: rgba(58,54,51,0.5); margin-bottom: 40px;">Dauer: ca. 3 Minuten</p>
          <button class="btn-primary" onclick="render('question')">Test starten</button>
        </div>
      `;
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      const progress = (currentQuestion / questions.length) * 100;
      app.innerHTML = `
        <div class="fade-in">
          <div class="progress-info">
            <span>Frage ${currentQuestion + 1} von ${questions.length}</span>
            <span>${Math.round(progress)}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
          <h2 class="question-text">${q.text}</h2>
          <div class="scale-options">
            ${scaleLabels.map((label, i) => `
              <button class="scale-btn" onclick="answerQuestion(${i + 1})">
                <span class="scale-num">${i + 1}</span>
                <span>${label}</span>
              </button>
            `).join('')}
          </div>
          ${currentQuestion > 0 ? '<button class="back-btn" onclick="goBack()">&larr; Zurück</button>' : ''}
        </div>
      `;
    }

    function answerQuestion(value) {
      answers[currentQuestion] = value;
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        render('email');
      }
    }

    function goBack() {
      currentQuestion--;
      renderQuestion();
    }

    function renderEmail() {
      app.innerHTML = `
        <div class="fade-in" style="text-align: center;">
          <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: var(--bordeaux); margin-bottom: 16px;">Geschafft.</h2>
          <p style="font-size: 1.15rem; margin-bottom: 32px; max-width: 450px; margin-left: auto; margin-right: auto;">
            Dein Ergebnis ist bereit. Gib deine E-Mail-Adresse ein — du bekommst dein Ergebnis sofort angezeigt und zusätzlich per Mail.
          </p>
          <form id="email-form" style="max-width: 400px; margin: 0 auto;">
            <input type="email" id="email-input" required placeholder="deine@email.de" class="email-input">
            <label class="checkbox-label">
              <input type="checkbox" id="privacy-check" required>
              <span>Ich stimme zu, dass meine E-Mail-Adresse und mein Testergebnis zur Zusendung meines Ergebnisses verarbeitet werden. <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a></span>
            </label>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Ergebnis anzeigen</button>
            <p class="hint">Kein Spam. Abmeldung jederzeit möglich.</p>
          </form>
        </div>
      `;
      document.getElementById('email-form').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!document.getElementById('privacy-check').checked) return;
        // Hier könnte Tally oder Mailerlite Integration hin
        console.log('Email:', document.getElementById('email-input').value);
        console.log('Score:', calculateScore());
        render('result');
      });
    }

    function calculateScore() {
      const total = answers.reduce((sum, a) => sum + a, 0);
      return Math.round((total / (questions.length * 5)) * 100);
    }

    function getCategory(score) {
      if (score <= 30) return 'balance';
      if (score <= 55) return 'warning';
      if (score <= 80) return 'attention';
      return 'acute';
    }

    function renderResult() {
      const score = calculateScore();
      const cat = getCategory(score);
      const r = results[cat];
      const c = colorMap[r.color];
      app.innerHTML = `
        <div class="fade-in" style="text-align: center;">
          <div class="result-circle" style="background: ${c.bg}; border-color: ${c.border};">
            <span>${score}%</span>
          </div>
          <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 600; color: var(--bordeaux); margin-bottom: 8px;">${r.title}</h2>
          <div class="result-card" style="background: ${c.bg}; border-color: ${c.border}; text-align: left;">
            <p style="font-size: 1.05rem; line-height: 1.7;">${r.description}</p>
            <p style="font-size: 1.05rem; line-height: 1.7;">${r.recommendation}</p>
          </div>
          <a href="${r.link}" class="btn-primary">${r.cta}</a>
          <div style="margin-top: 32px;">
            <p style="font-size: 0.85rem; color: rgba(58,54,51,0.35); margin-bottom: 8px;">Du kennst jemanden, dem dieser Test helfen könnte?</p>
            <button class="share-btn" onclick="shareTest()">Test teilen</button>
          </div>
        </div>
      `;
    }

    function shareTest() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: 'Nervensystem-Selbsttest', url: url });
      } else {
        navigator.clipboard.writeText(url);
        document.querySelector('.share-btn').textContent = 'Link kopiert!';
        setTimeout(() => { document.querySelector('.share-btn').textContent = 'Test teilen'; }, 2000);
      }
    }

    // Start
    render('intro');
  </script>

</body>
</html>
