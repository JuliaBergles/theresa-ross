  <style>
    /* Test */
    .test-container { max-width: 660px; margin: 0 auto; padding: 120px 24px 100px; min-height: 80vh; }
    .btn-primary { display: inline-block; background: var(--accent); color: var(--text-on-dark); font-family: var(--font-body); font-weight: 600; font-size: 1rem; padding: 16px 32px; border-radius: 4px; transition: background 0.2s; border: none; cursor: pointer; }

    .btn-secondary:hover { background: var(--text-on-light); color: var(--bg-primary); }
    .btn-ghost { background: none; border: none; font-family: var(--font-body); font-size: 0.85rem; color: var(--text-on-light-muted); cursor: pointer; text-decoration: underline; transition: color 0.2s; }

      font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2rem);

    /* Options */
    .options { display: flex; flex-direction: column; gap: 10px; max-width: 520px; margin: 0 auto; }
    .option-btn {
      width: 100%; text-align: left; padding: 1.1rem 1.5rem; border-radius: 4px;
      border: 1px solid var(--border-light); background: transparent;

    .option-btn:hover {

    .option-btn.selected {

    .multi-btn { position: relative; padding-left: 3.25rem; }
    .multi-btn::before {
      content: ''; position: absolute; left: 1.125rem; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--border-light);
      background: transparent; transition: all 0.2s ease;
    }
    .multi-btn.selected::before {
      background: var(--accent); border-color: var(--accent);
    }
    .multi-btn.selected::after {

    /* Textarea */

      font-family: var(--font-body); font-size: 0.95rem; color: var(--text-on-light);

    /* Navigation */

    /* Result */

<script>
// ============================================================
// SELBSTTEST — Theresa Ross
// Ehrlich differenzierend. Keine Diagnosen. Keine Heilversprechen.
// ============================================================

const CRISIS_WORDS = [
  'nicht mehr leben', 'aufgeben', 'verschwinden', 'kein sinn',
  'alles vorbei', 'will nicht mehr', 'will weg', 'suizid',
  'umbringen', 'sterben', 'tod', 'hoffnungslos'
];

const SECTIONS = {
  A: 'Über dich',
  B: 'Körper und Beschwerden',
  C: 'Nervensystem und Stress',
  D: 'Verbindung und Alltag',
  E: 'Abschluss'
};

const questions = [
  // === A — Über dich ===
  {
    id: 'A1', section: 'A', type: 'single',
    text: 'Wie alt bist du?',
    options: [
      { label: 'Unter 25', value: 'u25' },
      { label: '25 bis 35', value: '25-35' },
      { label: '35 bis 45', value: '35-45' },
      { label: '45 bis 55', value: '45-55' },
      { label: 'Über 55', value: '55+' },
    ],
    points: {} // kein Scoring
  },
  {
    id: 'A2', section: 'A', type: 'single',
    text: 'Wie sieht dein Alltag gerade aus?',
    options: [
      { label: 'Ich lebe allein', value: 'allein' },
      { label: 'Ich lebe mit Partner/Partnerin', value: 'partner' },
      { label: 'Ich lebe mit Kindern', value: 'kinder' },
      { label: 'Ich pflege Angehörige', value: 'pflege' },
      { label: 'Anderes', value: 'anderes' },
    ],
    points: {}
  },
  {
    id: 'A3', section: 'A', type: 'text', optional: true,
    text: 'Was hat dich heute zu diesem Test geführt?',
    placeholder: 'Du musst hier nichts schreiben. Aber wenn du magst, hilft es dir vielleicht, es einmal in Worte zu fassen.',
    crisisCheck: true
  },

  // === B — Körper und Beschwerden ===
  {
    id: 'B1', section: 'B', type: 'multi',
    text: 'Hast du eine oder mehrere ärztlich gestellte Diagnosen?',
    options: [
      { label: 'Reizdarm', value: 'reizdarm' },
      { label: 'Histaminintoleranz', value: 'histamin' },
      { label: 'Zöliakie / Glutenunverträglichkeit', value: 'zoeliakie' },
      { label: 'Andere Unverträglichkeiten', value: 'unvertraeglichkeit' },
      { label: 'Allergien', value: 'allergien' },
      { label: 'Endometriose', value: 'endometriose' },
      { label: 'Hashimoto', value: 'hashimoto' },
      { label: 'Burn-out / chronische Erschöpfung', value: 'burnout' },
      { label: 'Andere', value: 'andere' },
      { label: 'Keine Diagnose', value: 'keine', exclusive: true },
    ],
    scoring: function(selected) {
      if (selected.includes('keine') || selected.length === 0) return 0;
      if (selected.length <= 2) return 1;
      if (selected.length <= 4) return 2;
      return 3;
    }
  },
  {
    id: 'B2', section: 'B', type: 'single',
    text: 'Wie oft hast du Bauchbeschwerden?',
    options: [
      { label: 'Selten oder nie', value: 'selten', points: 0 },
      { label: 'Ungefähr einmal im Monat', value: 'monatlich', points: 1 },
      { label: 'Mehrmals pro Woche', value: 'woechentlich', points: 2 },
      { label: 'Fast täglich', value: 'taeglich', points: 3 },
    ]
  },
  {
    id: 'B3', section: 'B', type: 'single',
    text: 'Wie schläfst du?',
    options: [
      { label: 'Ich schlafe meistens gut', value: 'gut', points: 0 },
      { label: 'Ich brauche lange zum Einschlafen', value: 'einschlafen', points: 1 },
      { label: 'Ich wache nachts oft auf', value: 'nachts_wach', points: 2 },
      { label: 'Ich wache morgens erschöpft auf', value: 'erschoepft', points: 3 },
    ]
  },
  {
    id: 'B4', section: 'B', type: 'single',
    text: 'Wie ist dein Energielevel im Alltag?',
    options: [
      { label: 'Gut und stabil', value: 'gut', points: 0 },
      { label: 'Wechselnd, mal gut, mal nicht', value: 'wechselnd', points: 1 },
      { label: 'Oft müde', value: 'oft_muede', points: 2 },
      { label: 'Meistens erschöpft', value: 'erschoepft', points: 3 },
    ]
  },
  {
    id: 'B5', section: 'B', type: 'single',
    text: 'Wie oft fühlst du dich angespannt oder nervös?',
    options: [
      { label: 'Selten', value: 'selten', points: 0 },
      { label: 'Manchmal', value: 'manchmal', points: 1 },
      { label: 'Oft', value: 'oft', points: 2 },
      { label: 'Fast immer', value: 'immer', points: 3 },
    ]
  },

  // === C — Nervensystem und Stress ===
  {
    id: 'C1', section: 'C', type: 'multi',
    text: 'Wie reagiert dein Körper auf Stress?',
    options: [
      { label: 'Magen-Darm-Beschwerden', value: 'magen' },
      { label: 'Hautprobleme', value: 'haut' },
      { label: 'Kopfschmerzen / Migräne', value: 'kopf' },
      { label: 'Schlaf gestört', value: 'schlaf' },
      { label: 'Konzentration lässt nach', value: 'konzentration' },
      { label: 'Stimmung kippt', value: 'stimmung' },
      { label: 'Sonstiges', value: 'sonstiges' },
    ],
    scoring: function(selected) {
      if (selected.length <= 1) return 0;
      if (selected.length === 2) return 1;
      if (selected.length <= 4) return 2;
      return 3;
    }
  },
  {
    id: 'C2', section: 'C', type: 'multi',
    text: 'Was hast du schon ausprobiert, um dich besser zu fühlen?',
    options: [
      { label: 'Ernährungsumstellung', value: 'ernaehrung' },
      { label: 'Sport / Bewegung', value: 'sport' },
      { label: 'Therapie / Psychotherapie', value: 'therapie' },
      { label: 'Meditation / Achtsamkeit', value: 'meditation' },
      { label: 'Yoga', value: 'yoga' },
      { label: 'Atemübungen', value: 'atem' },
      { label: 'Heilpraktiker', value: 'heilpraktiker' },
      { label: 'Supplements / Nahrungsergänzung', value: 'supplements' },
      { label: 'Anderes', value: 'anderes' },
      { label: 'Noch nichts', value: 'nichts', exclusive: true },
    ],
    scoring: function(selected) {
      if (selected.includes('nichts') || selected.length <= 2) return 0;
      if (selected.length <= 4) return 1;
      if (selected.length <= 6) return 2;
      return 3;
    }
  },
  {
    id: 'C3', section: 'C', type: 'single',
    text: 'Wie leicht fällt es dir, tagsüber zur Ruhe zu kommen?',
    options: [
      { label: 'Leicht, das gelingt mir meistens', value: 'leicht', points: 0 },
      { label: 'Mal so, mal so', value: 'mittel', points: 1 },
      { label: 'Schwer, ich bin meistens angespannt', value: 'schwer', points: 2 },
      { label: 'Fast unmöglich', value: 'unmoeglich', points: 3 },
    ]
  },
  {
    id: 'C4', section: 'C', type: 'text', optional: true,
    text: 'Was tust du für dich, das dir gut tut?',
    placeholder: 'Das kann alles sein. Ein Spaziergang, ein Buch, eine Tasse Tee.',
    crisisCheck: true
  },
  {
    id: 'C5', section: 'C', type: 'single',
    text: 'Wie fühlt sich dein Körper meistens an?',
    options: [
      { label: 'Entspannt und beweglich', value: 'entspannt', points: 0 },
      { label: 'Wechselnd', value: 'wechselnd', points: 1 },
      { label: 'Oft angespannt', value: 'angespannt', points: 2 },
      { label: 'Hart und blockiert', value: 'blockiert', points: 3 },
    ]
  },

  // === D — Verbindung und Alltag ===
  {
    id: 'D1', section: 'D', type: 'single',
    text: 'Wie ist dein Verhältnis zu Freundinnen und Familie?',
    options: [
      { label: 'Unterstützend', value: 'unterstuetzend', points: 0 },
      { label: 'Sehr eng', value: 'eng', points: 0 },
      { label: 'Neutral', value: 'neutral', points: 1 },
      { label: 'Schwierig', value: 'schwierig', points: 2 },
      { label: 'Distanziert', value: 'distanziert', points: 3 },
    ]
  },
  {
    id: 'D2', section: 'D', type: 'single',
    text: 'Hast du jemanden, mit dem du wirklich offen sprechen kannst?',
    options: [
      { label: 'Ja, jederzeit', value: 'ja', points: 0 },
      { label: 'Jemanden, den ich anrufen könnte', value: 'jemand', points: 1 },
      { label: 'Niemand, der wirklich versteht', value: 'niemand', points: 2 },
      { label: 'Ich rede meistens mit niemandem', value: 'keiner', points: 3 },
    ]
  },
  {
    id: 'D3', section: 'D', type: 'single',
    text: 'Wie oft bewegst du dich in der Natur?',
    options: [
      { label: 'Täglich', value: 'taeglich', points: 0 },
      { label: 'Wöchentlich', value: 'woechentlich', points: 1 },
      { label: 'Selten', value: 'selten', points: 2 },
      { label: 'Fast nie', value: 'nie', points: 3 },
    ]
  },
  {
    id: 'D4', section: 'D', type: 'single',
    text: 'Wie verbunden fühlst du dich mit deinem Körper?',
    options: [
      { label: 'Sehr verbunden', value: 'sehr', points: 0 },
      { label: 'Okay, könnte besser sein', value: 'okay', points: 1 },
      { label: 'Wenig, ich spüre ihn kaum', value: 'wenig', points: 2 },
      { label: 'Ich habe das Gefühl, wir sind getrennt', value: 'getrennt', points: 3 },
    ]
  },

  // === E — Abschluss ===
  {
    id: 'E1', section: 'E', type: 'text', optional: true,
    text: 'Wenn du jetzt eine Sache an deinem Leben sofort ändern könntest, was wäre es?',
    placeholder: 'Nimm dir einen Moment. Es gibt keine falsche Antwort.',
    crisisCheck: true
  },
];

// ============================================================
// STATE
// ============================================================
let currentIndex = 0;
let answers = {};
let crisisDetected = false;
const app = document.getElementById('app');

// ============================================================
// CRISIS CHECK
// ============================================================
function checkCrisis(text) {
  if (!text) return false;
  const lower = text.toLowerCase();
  return CRISIS_WORDS.some(w => lower.includes(w));
}

function showCrisisOverlay() {
  crisisDetected = true;
  const overlay = document.createElement('div');
  overlay.className = 'crisis-overlay fade-in';
  overlay.innerHTML = `
    <div class="crisis-card">
      <h2>Einen Moment.</h2>
      <p>Du hast gerade etwas geschrieben, das mich aufmerksam macht.</p>
      <p>Wenn du wirklich in einer dunklen Phase bist, ist ein Selbsttest nicht das, was du jetzt brauchst.</p>
      <p>Die Telefonseelsorge ist 24 Stunden kostenfrei und anonym:</p>
      <div class="crisis-phone">0800 111 0 111</div>
      <p>Bitte melde dich dort. Du musst das nicht alleine schaffen.</p>
      <div style="margin-top: 32px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
        <a href="tel:08001110111" class="btn-primary" style="text-decoration:none;">Telefonseelsorge anrufen</a>
        <button class="btn-ghost" style="margin-top: 8px;" onclick="this.closest('.crisis-overlay').remove()">Trotzdem mit dem Test weitermachen</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

// ============================================================
// SCORING
// ============================================================
function calculateResult() {
  let totalPoints = 0;

  questions.forEach(q => {
    const answer = answers[q.id];
    if (!answer) return;

    if (q.type === 'multi' && q.scoring) {
      totalPoints += q.scoring(answer);
    } else if (q.type === 'single' && q.options) {
      const selected = q.options.find(o => o.value === answer);
      if (selected && typeof selected.points === 'number') {
        totalPoints += selected.points;
      }
    }
  });

  // Cluster D override
  const b3 = answers['B3'], b4 = answers['B4'], b5 = answers['B5'];
  const severeOverride = (b3 === 'erschoepft' && b4 === 'erschoepft' && b5 === 'immer');

  if (severeOverride || totalPoints >= 28) return 'D';
  if (totalPoints >= 18) return 'C';
  if (totalPoints >= 9) return 'B';
  return 'A';
}

// ============================================================
// RENDER
// ============================================================
function render(phase) {
  switch(phase) {
    case 'intro': renderIntro(); break;
    case 'question': renderQuestion(); break;
    case 'result': renderResult(); break;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderIntro() {
  app.innerHTML = `
    <div class="fade-in" style="text-align: center; padding-top: 60px;">
      <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 600; color: var(--bordeaux); margin-bottom: 20px; line-height: 1.2;">Nervensystem-Selbsttest</h1>
      <p style="font-size: 1.1rem; max-width: 480px; margin: 0 auto 8px; line-height: 1.7;">Finde heraus, wo du gerade stehst. Ehrlich, anonym, in 10-15 Minuten.</p>
      <p style="font-size: 0.85rem; color: rgba(58,54,51,0.45); margin-bottom: 40px;">18 Fragen in 4 Abschnitten. Deine Antworten bleiben in deinem Browser und werden nicht gespeichert.</p>
      <button class="btn-primary" onclick="render('question')">Test starten</button>
    </div>
  `;
}

function renderQuestion() {
  const q = questions[currentIndex];
  const total = questions.length;
  const progress = (currentIndex / total) * 100;
  const sectionName = SECTIONS[q.section];

  let optionsHTML = '';
  let navHTML = '';

  if (q.type === 'single') {
    const current = answers[q.id] || null;
    optionsHTML = `<div class="options">${q.options.map(o =>
      `<button class="option-btn ${current === o.value ? 'selected' : ''}" data-value="${o.value}">${o.label}</button>`
    ).join('')}</div>`;
  } else if (q.type === 'multi') {
    const current = answers[q.id] || [];
    optionsHTML = `<div class="options">${q.options.map(o =>
      `<button class="multi-btn ${current.includes(o.value) ? 'selected' : ''}" data-value="${o.value}" ${o.exclusive ? 'data-exclusive="true"' : ''}>${o.label}</button>`
    ).join('')}</div>
    <div class="q-nav"><div>${currentIndex > 0 ? '<button class="btn-ghost" id="back-btn">&larr; Zurück</button>' : ''}</div><button class="btn-primary" id="next-btn" style="font-size: 0.9rem; padding: 12px 28px;">Weiter</button></div>`;
  } else if (q.type === 'text') {
    const current = answers[q.id] || '';
    optionsHTML = `
      <textarea class="text-input" id="text-answer" placeholder="${q.placeholder || ''}">${current}</textarea>
      ${q.optional ? '<p class="skip-hint">Diese Frage ist optional.</p>' : ''}
      <div class="q-nav"><div>${currentIndex > 0 ? '<button class="btn-ghost" id="back-btn">&larr; Zurück</button>' : ''}</div><button class="btn-primary" id="next-btn" style="font-size: 0.9rem; padding: 12px 28px;">${q.optional ? 'Weiter' : 'Weiter'}</button></div>
    `;
  }

  app.innerHTML = `
    <div class="fade-in">
      <div class="progress-wrap">
        <div class="progress-info">
          <span>${sectionName}</span>
          <span>${currentIndex + 1} / ${total}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
      </div>
      <p class="section-label">${sectionName}</p>
      <h2 class="question-text">${q.text}</h2>
      ${optionsHTML}
    </div>
  `;

  // Event handlers
  if (q.type === 'single') {
    app.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[q.id] = btn.dataset.value;
        goNext();
      });
    });
  } else if (q.type === 'multi') {
    app.querySelectorAll('.multi-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!answers[q.id]) answers[q.id] = [];
        const val = btn.dataset.value;
        const isExclusive = btn.dataset.exclusive === 'true';

        if (isExclusive) {
          answers[q.id] = [val];
        } else {
          answers[q.id] = answers[q.id].filter(v => {
            const opt = q.options.find(o => o.value === v);
            return !opt?.exclusive;
          });
          if (answers[q.id].includes(val)) {
            answers[q.id] = answers[q.id].filter(v => v !== val);
          } else {
            answers[q.id].push(val);
          }
        }
        renderQuestion(); // re-render to show selection
      });
    });
    document.getElementById('next-btn')?.addEventListener('click', goNext);
  } else if (q.type === 'text') {
    document.getElementById('next-btn')?.addEventListener('click', () => {
      const val = document.getElementById('text-answer').value.trim();
      answers[q.id] = val;
      if (q.crisisCheck && checkCrisis(val)) {
        showCrisisOverlay();
      }
      goNext();
    });
  }

  document.getElementById('back-btn')?.addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; renderQuestion(); }
  });
}

function goNext() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    render('result');
  }
}

  if (cluster === 'D') {

    ctaHTML += `<button class="btn-secondary" onclick="showEbookForm()">Wenn ich trotzdem das E-Book möchte</button>`;

      ctaHTML += `<a href="privatpersonen.html#vagusflow" class="btn-secondary" style="text-decoration:none; text-align:center;">Mehr über das Coaching</a>`;

}
